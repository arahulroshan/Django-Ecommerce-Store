<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <h1>📦 My Orders</h1>

    <div class="cart-container">

        {% if orders %}

            {% for order in orders %}

                <div class="cart-item">

                    <h2>
                        Order #{{ order.id }}
                    </h2>

                    <p class="price">
                        Total Amount: ₹{{ order.total_price }}
                    </p>

                    <p>
                        Order Date: {{ order.created_at }}
                    </p>

                </div>

            {% endfor %}

        {% else %}

            <div class="cart-item">
                <h2>No orders found.</h2>
            </div>

        {% endif %}

        <a class="continue" href="{% url 'home' %}">
            ← Continue Shopping
        </a>

    </div>

</body>
</html>
